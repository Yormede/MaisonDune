services:
  maisondune-web:
    image: nginx:1.27-alpine
    container_name: maisondune-web
    restart: unless-stopped
    ports:
      - "${MAISONDUNE_HTTP_PORT:-8090}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "com.project=maisondune"
